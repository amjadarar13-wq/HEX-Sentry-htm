<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX Security — Discord Moderation Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .background-glow {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(0, 229, 255, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #6366f1;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 10px;
        }

        h1 span {
            color: #38bdf8;
        }

        p {
            color: #9ca3af;
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.04);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feature-item {
            font-size: 0.88rem;
            font-weight: 700;
            color: #e2e8f0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(59, 130, 246, 0.5);
        }

        .btn-secondary {
            background: #1f2937;
            color: #f1f5f9;
            border: 1px solid #374151;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #374151;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>

    <div class="card">
        <!-- شعار بوت الحماية HEX Security -->
        <img src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/svg/1f3e0.svg" alt="HEX Security Logo" class="logo">
        
        <h1>HEX <span>Security</span> 🛡️</h1>
        <p>بوت الحماية والرقابة الإدارية المتقدم لسيرفرات الديسكورد. نظام حظر إعلانات وروابط تلقائي، لوحة تحكم تفاعلية، وأوامر إدارية فورية لحماية مجتمعك 24/7.</p>

        <div class="features">
            <div class="feature-item">🛡️ حماية ضد السبام</div>
            <div class="feature-item">🎛️ لوحة /panel</div>
            <div class="feature-item">⚡ استجابة فورية</div>
        </div>

        <div class="btn-group">
            <!-- رابط إضافة البوت إلى السيرفر -->
            <a id="invite-btn" href="https://discord.com/oauth2/authorize?client_id=1549770370012287108&permissions=8&integration_type=0&scope=bot+applications.commandse=bot%20applications.commands" class="btn" target="_blank">
                🤖 إضافة البوت إلى ديسكورد
            </a>
        </div>

        <div class="footer">
            HEX Security Operations • Powered by Discord.py © 2026
        </div>
    </div>

    <script>
        // جلب رابط الدعوة المباشر تلقائياً في حال وجود API خادم Flask
        async function loadInvite() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (data.invite_url && data.invite_url !== '#') {
                    document.getElementById('invite-btn').href = data.invite_url;
                }
            } catch (e) {
                // استخدام الرابط الافتراضي في حال عدم وجود API
            }
        }
        loadInvite();
    </script>
</body>
</html>
